<div class="auth-wrap">
  <div class="auth-card">
    <h2>Login</h2>
    <p class="sub">Use your username (email) and password to continue.</p>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Username (email)</label>
        <input type="text" formControlName="username" placeholder="you@email.com">
        <small *ngIf="form.controls.username.touched && form.controls.username.invalid">
          Username is required
        </small>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••">
        <small *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required
        </small>
      </div>

      <p *ngIf="error" class="msg error">{{ error }}</p>

      <div class="actions">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </div>

      <p class="footer">Don’t have an account? <a routerLink="/signup">Sign up</a></p>
    </form>
  </div>
</div>
